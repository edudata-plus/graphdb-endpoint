<VirtualHost *:80>
    ServerName rdf.edudata.jp

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =rdf.edudata.jp
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName rdf.edudata.jp

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/rdf.edudata.jp/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rdf.edudata.jp/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Yasgui
    Alias /sparql/ /project/graphdb-endpoint/yasgui/

    <Directory /project/graphdb-endpoint/yasgui/>
        Require all granted
        Options -Indexes
    </Directory>

    RedirectMatch 301 ^/sparql$ /sparql/

    # GraphDB SPARQL endpoint
    ProxyPass        /sparql-endpoint/textbook http://127.0.0.1:7200/repositories/jp-textbook
    ProxyPassReverse /sparql-endpoint/textbook http://127.0.0.1:7200/repositories/jp-textbook
    ProxyPass        /sparql-endpoint/cos http://127.0.0.1:7200/repositories/jp-cos
    ProxyPassReverse /sparql-endpoint/cos http://127.0.0.1:7200/repositories/jp-cos

    # forward proxy は無効
    ProxyRequests Off

    ErrorLog ${APACHE_LOG_DIR}/rdf.edudata.jp-error.log
    CustomLog ${APACHE_LOG_DIR}/rdf.edudata.jp-access.log combined
</VirtualHost>
