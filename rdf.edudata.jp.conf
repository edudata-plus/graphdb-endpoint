<VirtualHost *:80>
    ServerName rdf.edudata.jp

    Redirect permanent / https://rdf.edudataplus.jp/
</VirtualHost>

<VirtualHost *:443>
    ServerName rdf.edudataplus.jp

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/rdf.edudataplus.jp/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rdf.edudataplus.jp/privkey.pem

    # Yasgui
    Alias /sparql/ /var/www/yasgui/

    <Directory /var/www/yasgui/>
        Require all granted
        Options -Indexes
    </Directory>

    RedirectMatch 301 ^/sparql$ /sparql/

    # GraphDB SPARQL endpoint
    ProxyPass        /sparql-endpoint http://127.0.0.1:7200/repositories/textbook
    ProxyPassReverse /sparql-endpoint http://127.0.0.1:7200/repositories/textbook

    # forward proxy は無効
    ProxyRequests Off

    ErrorLog ${APACHE_LOG_DIR}/rdf.edudataplus.jp-error.log
    CustomLog ${APACHE_LOG_DIR}/rdf.edudataplus.jp-access.log combined
</VirtualHost>