<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SPARQL Query</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/@matdata/yasgui/build/yasgui.min.css"
  >
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
  >
</head>

<body>

<div id="yasgui"></div>

<script src="https://unpkg.com/@matdata/yasgui/build/yasgui.min.js"></script>

<script>
const yasgui = new Yasgui(
  document.getElementById("yasgui"),
  {
    persistenceId: null,

    requestConfig: {
      endpoint: "/sparql-endpoint/textbook",
      method: "POST"
    },

    // デフォルト true。明示してもよい
    populateFromUrl: true,

    endpointButtons: [
      {
        endpoint: "/sparql-endpoint/textbook",
        label: "Textbook LOD"
      },
      {
        endpoint: "/sparql-endpoint/cos",
        label: "Course of Study LOD"
      }
    ]
  }
);
</script>

</body>
</html>
