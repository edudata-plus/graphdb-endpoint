<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SPARQL Query</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/@matdata/yasgui/build/yasgui.min.css"
  >
</head>

<body>

<div id="yasgui"></div>

<script src="https://unpkg.com/@matdata/yasgui/build/yasgui.min.js"></script>

<script>
const params = new URLSearchParams(window.location.search);

const endpoints = {
  "jp-textbook": "/sparql-endpoint/textbook",
  "jp-cos": "/sparql-endpoint/cos"
};

const key = params.get("endpoint");

const defaultEndpoint =
  endpoints[key] || endpoints["jp-textbook"];

const yasgui = new Yasgui(
  document.getElementById("yasgui"),
  {
    requestConfig: {
      endpoint: defaultEndpoint,
      method: "POST"
    },

    endpointButtons: [
      {
        endpoint: endpoints["jp-textbook"],
        label: "Textbook LOD"
      },
      {
        endpoint: endpoints["jp-cos"],
        label: "Course of Study LOD"
      }
    ]
  }
);
</script>

</body>
</html>
